name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Xvfb + Qt runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libegl1 \
            libgl1 \
            libdbus-1-3

      - name: Install Perch + dev extras
        run: |
          python -m pip install --upgrade pip
          # Ubuntu 24.04's distro PySide6 is 6.4 (too old — docs/10-packaging.md).
          # Install from PyPI unconditionally to match our >=6.8 pin.
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: intent-dispatch audit
        # Every variant of the ``Intent`` ADT must have a handler
        # that does real work (not just a ``log.info(...)``). Catches
        # the "shipped stub" class of bug; exit code is finding count.
        run: python tools/intent_dispatch_audit.py

      - name: CI/local lockstep
        run: python tools/ci_lockstep_check.py

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -ra

  docs:
    # Mechanical documentation checks: every relative link resolves, and no
    # retired or forbidden string has crept outside the documents that exist
    # to record it. Stdlib-only, so there is nothing to install. This is the
    # same script `./local_CI.sh --docs` runs for a documentation-only push.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: docs check (links + drift)
        run: python3 tools/docs_check.py

  packaging:
    # Packaging-artefact validation: the metainfo + desktop entry + the
    # Flatpak manifest + the RPM spec all have to stay well-formed so a
    # Flathub/OBS/COPR/AUR submission doesn't fail at the last step.
    # Runs independent of the test matrix so validation failures surface
    # without blocking on the Python test grid.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            desktop-file-utils \
            rpm \
            yamllint

      - name: appstream-util validate (metainfo)
        run: |
          # `appstreamcli validate` is the modern replacement for
          # `appstream-util validate-relax`; Ubuntu 24.04's appstream
          # package ships it. --no-net keeps the check offline; the
          # --pedantic upgrade is deliberately NOT enabled because the
          # screenshot URLs are still on `main` pre-release and would
          # fail the strict mirror check.
          appstreamcli validate --no-net \
              data/io.github.milnet01.Perch.metainfo.xml

      - name: desktop-file-validate
        run: desktop-file-validate data/io.github.milnet01.Perch.desktop

      - name: yamllint (Flatpak manifest)
        run: |
          # Lax config — Flathub's auto-generated python3-*.yml includes
          # don't adhere to strict yamllint rules, but the manifest we
          # author does.
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
              packaging/flathub/io.github.milnet01.Perch.yml

      - name: rpmspec parse (OBS/COPR spec)
        run: |
          # `rpmspec -P` expands macros and prints the parsed spec to
          # stdout; exit code is non-zero on syntax errors. We redirect
          # stdout because the expansion is verbose.
          rpmspec -P packaging/rpm/perch.spec > /dev/null

      - name: PKGBUILD shell syntax (bash -n)
        run: |
          # AUR PKGBUILDs are bash scripts with well-known globals;
          # `bash -n` catches syntax errors without executing anything.
          bash -n packaging/aur/PKGBUILD
          bash -n packaging/aur/perch-git/PKGBUILD

      - name: KWin script metadata.json well-formedness
        run: |
          python3 -c 'import json, sys; json.load(open("src/perch/backend/kwin/script/metadata.json"))'
