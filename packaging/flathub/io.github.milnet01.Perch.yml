# =============================================================================
# Flathub manifest for Perch
# =============================================================================
# Runbook and submission steps: SUBMISSION.md next to this file.
#
# Perch builds on the freedesktop runtime and bundles its own Qt, from the
# PySide6-Essentials wheel on PyPI. It does NOT use the KDE runtime with
# io.qt.PySide.BaseApp: PySide6 links Qt's private API, which is tagged with
# the exact Qt patch release, so every KDE runtime patch update broke an
# installed copy until someone rebuilt it (PERC-0091). A bundled Qt only
# changes when this manifest does.
#
# Non-Qt Python dependencies are pinned in python3-deps.yaml, generated by
# generate-pip-sources.sh and COMMITTED, because Flathub's builders have no
# network. The two Qt wheels and krb5 are pinned below by hand; to bump them,
# take the URL and sha256 from PyPI's JSON API (or the krb5 release page),
# then rebuild with flatpak-build.sh.
#
# SUBMISSION NOTE: the perch module's git source is pinned to a release tag
# AND its immutable commit. Re-pin both before a Flathub PR, and regenerate
# python3-deps.yaml if the closure moved. flathub.json beside this manifest
# restricts the buildbot to x86_64, which is the arch the pinned wheels cover.
# =============================================================================

app-id: io.github.milnet01.Perch
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: perch

# Every entry is checked by flatpak-builder-lint, which Flathub runs on the
# submission. These were removed after that linter reported them:
# --socket=session-bus (finish-args-arbitrary-dbus-access -- the named
# --talk-name grants below are how a sandboxed app reaches specific
# services, and the blanket socket makes them meaningless),
# --own-name=io.github.milnet01.Perch and
# --talk-name=org.freedesktop.portal.Desktop, both of which flatpak grants
# by default, and --filesystem=xdg-config/perch:create, which never did
# what it claimed -- the sandbox redirects XDG_CONFIG_HOME, so Perch
# writes its config inside the sandbox and the host grant went unused.
# Do not reinstate them without re-running the linter.
finish-args:
  # Display + input
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11          # XWayland-only or X11-session users

  # Named services Perch must reach. These are the whole D-Bus surface --
  # there is no blanket session-bus socket.
  - --talk-name=org.kde.KWin                 # KWin scripting IPC
  - --talk-name=org.kde.kglobalaccel         # hotkey registration fallback
  - --talk-name=org.freedesktop.Notifications  # backend_error balloons
  # Without this the tray icon never appears: xdg-dbus-proxy answers
  # ServiceUnknown, so Perch can neither probe for a StatusNotifier host
  # nor register its item. Perch has no window -- the tray IS the app.
  - --talk-name=org.kde.StatusNotifierWatcher

  # Filesystem access. KWin on the host cannot read /app, so the bundled
  # KWin script has to be mirrored into the host's script directory at
  # first run. Perch resolves that target from $HOME rather than from the
  # sandbox's XDG_DATA_HOME, which points somewhere KWin cannot read.
  - --filesystem=xdg-data/kwin/scripts:create

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
  - '*.pyc'
  - /lib/python*/site-packages/**/__pycache__

modules:
  # --- MIT Kerberos -----------------------------------------------------------
  # Qt's network library links libgssapi_krb5, and the freedesktop runtime
  # does not ship it. Perch needs QtNetwork for its single-instance socket
  # (src/perch/instance.py), so without this the app dies at import.
  - name: krb5
    subdir: src
    config-opts:
      - --disable-static
      - --disable-rpath
      - --disable-pkinit
      - --without-keyutils
      - --without-ldap
      - --without-libedit
    build-options:
      env:
        # krb5's configure adds -Werror=discarded-qualifiers unless
        # WARN_CFLAGS is set, and GCC 16 (the 26.08 Sdk) then fails on
        # krb5 1.22.2's own strchr() call sites.
        WARN_CFLAGS: -Wall
    cleanup:
      - /bin
      - /sbin
      - /lib/krb5
      - /share/examples
      - /share/locale
      - /var
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13

  # --- PySide6 + Qt -----------------------------------------------------------
  # The Qt Company's own wheels: abi3, so any python >= 3.10 imports them.
  # perch's build step trims them to the modules Perch loads
  # (trim-pyside6.sh).
  - name: python3-pyside6-essentials
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
          --no-build-isolation pyside6_essentials shiboken6
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7b/3c/7597d8dcb36aa8315427635ec6ec9d850ffbad4ce78b9118ac854889f2d3/pyside6_essentials-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 16f4b5e41daf49235ae048458243da9efe5f3d8040f9cc5aa454ce69893d3bd9
      - type: file
        url: https://files.pythonhosted.org/packages/49/c2/a04fa003b4360e99d8e3fc2829abacf37396ace63ea1cd616402209ec7c6/shiboken6-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 3bde565bb0890044b5c7f63808adddede5abc241e9395a2bfed61919884d6240

  # --- Other Python deps -------------------------------------------------------
  # sha256-pinned wheels for qasync, sdbus, python-xlib, tomlkit and regex, plus the
  # hatchling build backend (the perch module installs with
  # --no-build-isolation, so the backend must already be present offline).
  # Regenerate with generate-pip-sources.sh; regex's cp314 wheel matches
  # org.freedesktop.Sdk//26.08's python 3.14.
  - python3-deps.yaml

  # --- Perch itself ----------------------------------------------------------
  - name: perch
    buildsystem: simple
    build-commands:
      # --no-deps: pyproject requires the PySide6 distribution, and the module
      # above installs PySide6-Essentials, which provides the same package
      # under another distribution name.
      - pip3 install --no-index --no-build-isolation --no-deps --prefix=${FLATPAK_DEST} .
      - bash packaging/flathub/trim-pyside6.sh ${FLATPAK_DEST}
      - install -Dm644 data/io.github.milnet01.Perch.desktop
          ${FLATPAK_DEST}/share/applications/io.github.milnet01.Perch.desktop
      - install -Dm644 data/io.github.milnet01.Perch.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.milnet01.Perch.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.milnet01.Perch.svg
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.milnet01.Perch.svg
      - install -Dm644 data/icons/hicolor/symbolic/status/perch-tray-symbolic.svg
          ${FLATPAK_DEST}/share/icons/hicolor/symbolic/status/perch-tray-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/status/perch-tray-warning-symbolic.svg
          ${FLATPAK_DEST}/share/icons/hicolor/symbolic/status/perch-tray-warning-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/status/perch-tray-error-symbolic.svg
          ${FLATPAK_DEST}/share/icons/hicolor/symbolic/status/perch-tray-error-symbolic.svg
      # KWin script: staged here; KWinBackend copies it to
      # ~/.local/share/kwin/scripts/ at first run because KWin on the host
      # cannot read /app paths.
      - install -Dm644 src/perch/backend/kwin/script/metadata.json
          ${FLATPAK_DEST}/share/perch/kwin/metadata.json
      - install -Dm644 src/perch/backend/kwin/script/contents/code/main.js
          ${FLATPAK_DEST}/share/perch/kwin/contents/code/main.js
    sources:
      - type: git
        url: https://github.com/milnet01/perch.git
        tag: v2.0.0
        commit: 1f9f33bd6a4b792b76103d345f374428d538836f
