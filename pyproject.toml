[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "perch"
version = "0.0.0"
description = "Persistent, compositor-aware window geometry manager with a system-tray UI."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "milnet01" }]
keywords = ["window-manager", "kde", "kwin", "wayland", "x11", "tray", "geometry", "layout"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: Window Managers",
]
# Version bounds from the Phase 2 + Phase 2.5 research logs (see docs/11-roadmap.md).
dependencies = [
    "PySide6>=6.8,<7",
    "qasync>=0.28,<1",
    "sdbus>=0.14.2,<1",
    "python-xlib>=0.33",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15,<0.16",
    "mypy>=1.20,<2",
    "pytest>=8.4,<10",
    "pytest-qt>=4.5,<5",
    "pytest-asyncio>=1.3,<2",
    "pytest-xvfb>=3",
]
# Optional backend extras (M6 stubs). These gate the Python-side transport
# bindings that are only meaningful when the matching compositor is the
# session's window manager.
sway = [
    "i3ipc>=2.2.1,<3",
]

[project.urls]
Homepage = "https://github.com/milnet01/perch"
Issues = "https://github.com/milnet01/perch/issues"
Documentation = "https://github.com/milnet01/perch/tree/main/docs"

[project.scripts]
perch = "perch.__main__:cli"

[tool.hatch.version]
path = "src/perch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/perch"]

[tool.hatch.build.targets.sdist]
include = [
    "src/perch",
    "tests",
    "docs",
    "data",
    "packaging",
    "scripts",
    "translations",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/perch", "tests"]

[[tool.mypy.overrides]]
module = ["qasync", "Xlib.*", "sdbus.*", "i3ipc", "i3ipc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
xvfb_width = 1280
xvfb_height = 720
markers = [
    "x11: live integration tests that require Xvfb + openbox; run with 'pytest -m x11' to include, 'pytest -m \"not x11\"' to exclude.",
    "kwin: live integration tests that spawn a private dbus + kwin_wayland --virtual; run with 'pytest -m kwin' to include, 'pytest -m \"not kwin\"' to exclude.",
]
