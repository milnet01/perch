# =============================================================================
# Perch — Audit Configuration
# =============================================================================
# Drives /mnt/Storage/Scripts/Linux/3D_Engine/tools/audit/audit.py
# (invoked via the /audit Claude Code skill, or directly for CI use).
#
# Auto-generated by `audit.py --init` then customised for Perch:
#   - dropped C++/3D-specific tier-4 patterns
#   - report written to .audit/report.md (gitignored — it's machine-generated)
#   - added Perch-specific "drift" patterns for retired APIs / swapped libraries
#     that Phase 2 research identified
#
# Run:
#   python3 /mnt/Storage/Scripts/Linux/3D_Engine/tools/audit/audit.py \
#       -c /mnt/Storage/Scripts/Linux/perch/audit_config.yaml
# =============================================================================

project:
  name: Perch
  root: .
  language: python
  source_dirs:
    - src/
    - experiments/   # M2.5 KWin IPC spike lands here
  # NB: tests/ is deliberately NOT in source_dirs — upstream audit.py's
  # exclude_pattern is line-content based (not path-based), so the standard
  # `test_|conftest\.py|/tests/` excludes on patterns like assert_in_production
  # and print_debug silently fail. Scanning tests/ produces ~90 noise
  # findings per run (assert in tests is fine; print in tests is fine) that
  # drown the actionable src/ signal. Security-scanning tests is still
  # valuable in principle — revisit once upstream supports path excludes.
  shader_dirs: []
  shader_glob: '*.glsl'
  source_extensions:
    - .py
  exclude_dirs:
    - .git/
    - __pycache__/
    - .venv/
    - venv/
    - env/
    - .tox/
    - dist/
    - build/
    - .audit_cache/
    - .audit/
    - docs/
    - '*.egg-info/'

build:
  system: pyproject
  build_dir: .
  configure_cmd: null
  build_cmd: null
  warning_regex: 'warning:|error:'
  # pytest runs the mock-backend compliance suite + unit tests. KWin / X11
  # integration tests are marked and skipped here (run in a nightly job, see
  # docs/11-roadmap.md and docs/05-backend-kwin.md).
  test_cmd: pytest --tb=short -m "not nightly and not kwin_integration" 2>&1
  sanitizer:
    enabled: false

static_analysis:
  cppcheck:
    enabled: false
  clang_tidy:
    enabled: false

patterns:
  # ─── Python security ────────────────────────────────────────────────────────
  security:
    - name: eval_exec
      # Negative lookbehind: skip `.exec(` (QDialog.exec, QApplication.exec,
      # any `obj.exec(...)`) and `foo_exec(` / `proc.execute(` — we only want
      # bare top-level `eval(` / `exec(` calls that evaluate Python strings.
      pattern: (?<![.\w])(eval|exec)\s*\(
      file_glob: '*.py'
      severity: high
      description: eval/exec — code injection risk
      skip_comments: true
    - name: shell_true
      pattern: shell\s*=\s*True
      file_glob: '*.py'
      severity: high
      description: subprocess shell=True — command injection risk
    - name: pickle_load
      pattern: pickle\.load
      file_glob: '*.py'
      severity: medium
      description: pickle.load — deserialization risk
    - name: yaml_unsafe_load
      pattern: yaml\.load\(
      file_glob: '*.py'
      severity: medium
      description: yaml.load without SafeLoader — code execution risk
      exclude_pattern: SafeLoader|safe_load
      skip_comments: true
    - name: temp_file_mktemp
      pattern: tempfile\.mktemp\(
      file_glob: '*.py'
      severity: medium
      description: mktemp is insecure — use mkstemp or NamedTemporaryFile (CWE-377)
      skip_comments: true

  # ─── Python best practices ──────────────────────────────────────────────────
  best_practices:
    - name: mutable_default_arg
      pattern: def\s+\w+\s*\([^)]*=\s*(\[\s*\]|\{\s*\}|set\s*\(\s*\))
      file_glob: '*.py'
      severity: high
      description: Mutable default argument — shared across calls, use None
      skip_comments: true
    - name: wildcard_import
      pattern: from\s+\w+\s+import\s+\*
      file_glob: '*.py'
      severity: high
      description: Wildcard import — pollutes namespace, use explicit imports
    - name: eq_none
      pattern: ==\s*None\b
      file_glob: '*.py'
      severity: low
      description: Use 'is None' instead of '== None' (PEP 8)
    - name: assert_in_production
      pattern: ^\s*assert\s+
      file_glob: '*.py'
      severity: info
      description: assert removed with -O — use explicit validation for non-test code
      # `is None`/`is not None`/`isinstance(...)`/`issubclass(...)` asserts are
      # the idiomatic mypy type-narrowing pattern; they are invariants, not
      # validation, so -O stripping them is a bug in the caller's deployment,
      # not a code smell. Path-like excludes (`/tests/`) are kept for
      # completeness but are inert in upstream audit.py (exclude_pattern
      # matches line content, not path).
      exclude_pattern: is\s+(not\s+)?None|isinstance\(|issubclass\(|test_|_test\.py|conftest\.py|/tests/
    - name: bare_except
      pattern: 'except\s*:'
      file_glob: '*.py'
      severity: medium
      description: Bare except — catches SystemExit/KeyboardInterrupt (CWE-396)
    - name: print_debug
      pattern: \bprint\s*\(
      file_glob: '*.py'
      severity: low
      description: print() — use logging instead
      # Path-based excludes like `__main__\.py` are inert (upstream audit.py
      # matches line content, not filename); the content-based `file=sys.stderr`
      # catches the legitimate CLI-error case that lives in __main__.py before
      # logging is configured.
      exclude_pattern: file\s*=\s*sys\.stderr|test_|__main__\.py|/cli\.py|/experiments/

  # ─── Perch-specific drift detectors ─────────────────────────────────────────
  # These catch code that slips back into decisions Phase 2 research overturned.
  # See docs/11-roadmap.md "Phase 2 research log" for why each is banned.
  perch_drift:
    - name: forbidden_import_dbus_next
      pattern: ^\s*(import|from)\s+dbus_next\b|^\s*(import|from)\s+dbus-next\b
      file_glob: '*.py'
      severity: high
      description: dbus-next was swapped for sdbus-python in Phase 2 (upstream dormant since 2022)
      skip_comments: true
    - name: forbidden_import_ewmh
      pattern: ^\s*(import|from)\s+ewmh\b
      file_glob: '*.py'
      severity: high
      description: python-ewmh was swapped for python-xlib + in-tree EWMH helper (unmaintained since 2017)
      skip_comments: true
    - name: forbidden_import_asyncqt
      pattern: ^\s*(import|from)\s+asyncqt\b
      file_glob: '*.py'
      severity: high
      description: asyncqt is abandoned; use qasync instead
      skip_comments: true
    - name: forbidden_import_tomli_w
      pattern: ^\s*(import|from)\s+tomli_w\b
      file_glob: '*.py'
      severity: high
      description: tomli_w does not preserve comments; Perch writes config.toml with tomlkit
      skip_comments: true
    - name: forbidden_import_qtasyncio
      pattern: ^\s*from\s+PySide6\s+import\s+QtAsyncio|QtAsyncio\.
      file_glob: '*.py'
      severity: high
      description: PySide6 QtAsyncio is technical-preview, lacks asyncSlot; Perch uses qasync
      skip_comments: true
    - name: deprecated_get_event_loop
      pattern: asyncio\.get_event_loop\(\)
      file_glob: '*.py'
      severity: medium
      description: asyncio.get_event_loop() is deprecated on 3.12+; use get_running_loop() or asyncSlot
      skip_comments: true
    - name: ensure_future_from_slot
      pattern: asyncio\.ensure_future\(
      file_glob: '*.py'
      severity: low
      description: ensure_future from a Qt slot loses exception propagation; use @qasync.asyncSlot
      exclude_pattern: /experiments/|test_|_test\.py
      skip_comments: true
    - name: retired_kwin_clientAdded
      pattern: \b(clientAdded|clientRemoved|clientList|clientActivated)\b
      file_glob: '*.py,*.js'
      severity: high
      description: Plasma 5 API; renamed to window{Added,Removed,List,Activated} in Plasma 6
      exclude_pattern: /docs/|CHANGELOG|# Plasma 5|// Plasma 5
      skip_comments: true
    - name: tight_poll_loop
      # Bug in the prior regex: `0\.0?(25|5|75|1)` matched `0.5` as well as
      # `0.025/0.05/0.075/0.1` because the `0?` made the leading zero optional.
      # Anchor the tenth digit explicitly — we only want 25/50/75/100 ms.
      pattern: (QTimer\.singleShot\(\s*(25|50|75|100)\b|asyncio\.sleep\(\s*0\.(025|05|075|1)\b)
      file_glob: '*.py'
      severity: info
      description: Tight polling loop — confirm this is not the KWin IPC command poll (should be long-poll, not tight poll)
      exclude_pattern: /experiments/|test_|_test\.py
      skip_comments: true
    - name: python_311_floor
      pattern: requires-python\s*=\s*[\"'][^\"']*3\.11|python_requires\s*=\s*[\"'][^\"']*3\.11
      file_glob: '*.toml,*.cfg,*.py'
      severity: medium
      description: Perch floors Python 3.12+ (see docs/11-roadmap.md Phase 2.5); >=3.11 is stale
      skip_comments: true

  # ─── Docs-first rule enforcement (lightweight — docs-drift-check.sh is primary) ──
  code_quality:
    - name: todo_fixme
      pattern: \b(TODO|FIXME|HACK|XXX)\b
      file_glob: '*.py,*.js'
      severity: info
      description: Deferred work marker
    - name: workaround_without_note
      # Project rule (CLAUDE.md global): workarounds must be documented.
      # Flag WORKAROUND markers that don't have a follow-up comment explaining the constraint.
      pattern: \bWORKAROUND\b
      file_glob: '*.py,*.js'
      severity: medium
      description: WORKAROUND marker — per CLAUDE.md, must document the underlying constraint inline

changes:
  base_ref: HEAD~1

# Tier 4 left at defaults but with Perch-appropriate values. These patterns
# are inherited from the C++/3D-engine lineage; for Perch they mostly won't
# fire because our source doesn't match them.
tier4:
  gpu_resource_pattern: __PERCH_UNUSED_GPU__
  event_subscribe_pattern: backend\.(window|output)_\w+\.connect\(
  event_unsubscribe_pattern: disconnect\(
  complexity_threshold: 300
  # Perch licenses at the repo root (LICENSE — GPL-3.0-or-later). Per-file
  # SPDX headers aren't required by the project; upstream's copyright
  # detector would otherwise flag every .py as "missing header" (48/48).
  copyright:
    enabled: false
  # Raise duplication threshold — at min_lines=5, trivial imports / slot
  # signatures / atom-table boilerplate fire 600+ clone pairs with no
  # refactor value. 12 lines is the band where duplicated *logic* lives.
  duplication:
    min_lines: 12

research:
  enabled: true
  cache_dir: .audit_cache
  cache_ttl_days: 7
  max_results_per_query: 3
  # Topics Perch cares about. The /audit skill's audit-triage subagent
  # cross-references findings against recent CVEs and guidance for these.
  # Schema: each topic is a dict with a `query` key (upstream tier5_research
  # crashes on bare strings — lib/tier5_research.py calls topic.get("query")).
  topics:
    - query: site:nvd.nist.gov PySide6 vulnerability
    - query: site:nvd.nist.gov qasync asyncio
    - query: site:nvd.nist.gov sdbus-python
    - query: KWin scripting API deprecation Plasma 6
    - query: site:docs.flatpak.org portal permission
    - query: site:nvd.nist.gov python-xlib vulnerability
    - query: site:nvd.nist.gov tomlkit
  custom_queries: []

report:
  output_path: .audit/report.md
  max_findings_per_category: 100
  include_json_blocks: true
  include_token_estimate: true

# Tier 6 (feature coverage sweep) is tiered for Vestige's very large test
# surface. Perch's tests are unlikely to need it early; add to `tiers:` list
# once test coverage is nontrivial (post-M2).
tiers:
  - 1
  - 2
  - 3
  - 4
  - 5
