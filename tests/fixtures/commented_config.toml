# Top-of-file comment — must survive round-trip.

schema_version = 1

# Comment directly above [general].
[general]
start_at_login    = true   # inline comment on start_at_login
restore_on_open   = true
notify_on_restore = false
theme             = "dark" # inline comment on theme

# Exclusions section — mid-document comment.
[exclusions]
patterns = [
  { app_id = "plasmashell" },         # KDE shell, never manage
  { wm_class = "Plasma*", type = "splash" },
]

# Snap presets.
[snaps]
# Comment inside the snaps table.
[snaps."center-60"]
geometry = { x = "20%", y = "20%", w = "60%", h = "60%", monitor = "current" }
hotkey   = "Meta+C"

# A representative rule.
[[rules]]
name  = "Firefox on external"       # comment above match
match = { app_id = "firefox" }
apply = { geometry = "maximize", monitor = "HDMI-1" }

# A representative layout.
[layouts.coding]
description = "Editor left, browser right."
[[layouts.coding.windows]]
match    = { app_id = "code" }
geometry = { x = "0%", y = "0%", w = "60%", h = "100%", monitor = "primary" }

# A representative profile.
[[profiles]]
name           = "Laptop only"
topology       = "eDP-1:1920x1200@0,0"
default_layout = "coding"
