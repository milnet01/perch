<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" width="960" height="320">
  <title>Perch</title>
  <desc>The Perch wordmark: the crested-bird icon on its branch, followed by the name "Perch" in rounded lettering. Light on transparent, for dark backgrounds.</desc>

  <!-- The app icon (data/icons/hicolor/scalable/apps/io.github.milnet01.Perch.svg),
       filled light and scaled so its branch sits on the lettering's baseline. -->
  <g fill="#EDEDF2" transform="translate(2 2) scale(1.75)">
    <rect x="0" y="12.4" width="16" height="1.2" rx="0.6"/>
    <path d="M 4 9 C 4 7 5.5 6 7.5 6 C 9.5 6 11 7 11 9 C 11 11 9.5 12 7.5 12
             L 6.5 12 L 6.5 11.4 L 5.5 11.4 L 5.5 11.7 C 4.5 11.4 4 10.3 4 9 Z"
          fill-opacity="0.6"/>
    <path d="M 4 8.5 L 0.5 4.5 L 1.5 7 L 0 7.5 L 1.2 9.5 Z"/>
    <circle cx="10.5" cy="5" r="2.3"/>
    <path d="M 12.5 4.5 L 14.5 3.5 L 13 5.5 Z"/>
    <path d="M 10.2 2.8 L 10.6 1.5 L 11 2.8 Z"/>
    <path d="M 6.5 11.8 L 6.5 12.5 M 8.2 11.8 L 8.2 12.5"
          stroke="#EDEDF2" stroke-width="0.7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- "Perch", drawn as round-capped strokes rather than set in a font, so it
       needs no font and borrows no glyphs. Baseline y=24, x-height 14, cap 8. -->
  <g fill="none" stroke="#EDEDF2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 36 24 V 8 H 41 A 4.5 4.5 0 0 1 41 17 H 36"/>
    <path d="M 48 19 H 58 A 5 5 0 1 0 56.5 22.6"/>
    <path d="M 63 24 V 14 M 63 18.5 A 4.5 4.5 0 0 1 67.5 14 H 68.5"/>
    <path d="M 79.5 15.9 A 5 5 0 1 0 79.5 22.1"/>
    <path d="M 84 8 V 24 M 84 18.5 A 4 4 0 0 1 92 18.5 V 24"/>
  </g>
</svg>
