<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>Perch (error)</title>
  <desc>Tray status icon — no compatible compositor detected. Main glyph in currentColor, red error badge hard-coded so the state signal survives recolouring.</desc>

  <g fill="currentColor">
    <rect x="0" y="12.4" width="16" height="1.2" rx="0.6"/>
    <path d="M 4 9 C 4 7 5.5 6 7.5 6 C 9.5 6 11 7 11 9 C 11 11 9.5 12 7.5 12 L 6.5 12 L 6.5 11.4 L 5.5 11.4 L 5.5 11.7 C 4.5 11.4 4 10.3 4 9 Z" fill-opacity="0.5"/>
    <path d="M 4 8.5 L 0.5 4.5 L 1.5 7 L 0 7.5 L 1.2 9.5 Z"/>
    <circle cx="10.5" cy="5" r="2.3"/>
    <path d="M 12.5 4.5 L 14.5 3.5 L 13 5.5 Z"/>
    <path d="M 10.2 2.8 L 10.6 1.5 L 11 2.8 Z"/>
    <path d="M 6.5 11.8 L 6.5 12.5 M 8.2 11.8 L 8.2 12.5"
          stroke="currentColor" stroke-width="0.7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Error badge: red circle with halo and white X cross. -->
  <g>
    <circle cx="13" cy="13" r="2.7"
            fill="#c62828"
            stroke="#ffffff"
            stroke-width="0.6"/>
    <path d="M 11.7 11.7 L 14.3 14.3 M 14.3 11.7 L 11.7 14.3"
          stroke="#ffffff"
          stroke-width="0.8"
          stroke-linecap="round"/>
  </g>
</svg>
