<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
  <title>Perch</title>
  <desc>A stylised crested bird perched on a branch. Icon for Perch, a window geometry manager.</desc>

  <!-- Branch / perch: horizontal rounded bar across the bottom -->
  <rect x="0" y="12.4" width="16" height="1.2" rx="0.6"/>

  <!-- Body: plump rounded shape with a small notch on the underside for the legs.
       Drawn at 50% opacity for a subtle two-tone against the solid head. -->
  <path d="M 4 9
           C 4 7 5.5 6 7.5 6
           C 9.5 6 11 7 11 9
           C 11 11 9.5 12 7.5 12
           L 6.5 12
           L 6.5 11.4
           L 5.5 11.4
           L 5.5 11.7
           C 4.5 11.4 4 10.3 4 9 Z"
        fill-opacity="0.5"/>

  <!-- Upswept angular tail feathers — the silhouette's most distinctive feature,
       three-pointed and sweeping up and to the left. -->
  <path d="M 4 8.5
           L 0.5 4.5
           L 1.5 7
           L 0 7.5
           L 1.2 9.5 Z"/>

  <!-- Head -->
  <circle cx="10.5" cy="5" r="2.3"/>

  <!-- Beak: sharp triangle pointing up-right -->
  <path d="M 12.5 4.5
           L 14.5 3.5
           L 13 5.5 Z"/>

  <!-- Small upright crest on top of the head — distinguishes this icon from
       the many generic bird silhouettes floating around. -->
  <path d="M 10.2 2.8
           L 10.6 1.5
           L 11 2.8 Z"/>

  <!-- Legs: two short marks connecting the body to the branch -->
  <path d="M 6.5 11.8 L 6.5 12.5 M 8.2 11.8 L 8.2 12.5"
        stroke="currentColor" stroke-width="0.7" stroke-linecap="round" fill="none"/>
</svg>
